openapi: 3.0.0

info:
  title: Task API
  version: 1.0.0
  description: >
    "A RESTful Task API built with Node.js, Express.js, and SQLite. 
     The API supports CRUD operations with persistent task storage."

servers:
  - url: http://localhost:3000

paths:

  /:
    get:
      summary: API Information
      description: Returns basic information about the Task API.
      responses:
        "200":
          description: API information returned successfully

  /tasks:
    get:
      summary: Get all tasks
      description: Returns all tasks from the in-memory task list.
      responses:
        "200":
          description: List of tasks returned successfully

    post:
      summary: Create a new task
      description: Adds a new task to the in-memory task list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: Build Candidate API
                description:
                  type: string
                  example: Create CRUD endpoints for candidates.
                priority:
                  type: string
                  example: High
                completed:
                  type: boolean
                  example: false

      responses:
        "201":
          description: Task created successfully

  /tasks/{id}:
    get:
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task found
        "404":
          description: Task not found

    put:
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                completed:
                  type: boolean

      responses:
        "200":
          description: Task updated successfully
        "404":
          description: Task not found

    delete:
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Task deleted successfully
        "404":
          description: Task not found